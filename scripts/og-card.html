<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #c8600a, #7a3b06);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px;
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }
      .badge svg { flex-shrink: 0; }
      .badge span {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 56px;
        line-height: 1.15;
        font-weight: 800;
        max-width: 950px;
        margin-bottom: 28px;
      }
      p {
        font-size: 28px;
        max-width: 900px;
        color: #ffe6c7;
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <svg width="56" height="56" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="32" fill="#fff" />
        <path d="M14 40 L26 20 L38 40 Z" fill="#c8600a" />
        <circle cx="44" cy="20" r="6" fill="#c8600a" />
        <rect x="10" y="40" width="44" height="6" rx="2" fill="#7a3b06" />
      </svg>
      <span>Güneş Hafriyat</span>
    </div>
    <h1>Bilecik ve Çevre İllerde Hafriyat, Nakliyat ve Kazı Hizmetleri</h1>
    <p>Bilecik · Bursa · Eskişehir · Kütahya · Sakarya · Kocaeli</p>
  </body>
</html>
